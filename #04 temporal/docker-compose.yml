services:
  gst-db-local:
    image: postgres:16
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gst-local-postgres-data:/var/lib/postgresql/data
      - ./initdb/001-gstfetch-schema.sql:/docker-entrypoint-initdb.d/001-gstfetch-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-complaince}"]
      interval: 5s
      timeout: 5s
      retries: 20

  infisical-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: infisical-local-password
      POSTGRES_DB: infisical
    volumes:
      - infisical-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 5s
      timeout: 5s
      retries: 20

  infisical-redis:
    image: redis:7-alpine
    volumes:
      - infisical-redis-data:/data

  infisical-migration:
    image: infisical/infisical:latest-postgres
    env_file: .env.infisical
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    command: ["npm", "run", "migration:latest"]

  infisical:
    image: infisical/infisical:latest-postgres
    env_file: .env.infisical
    depends_on:
      infisical-migration:
        condition: service_completed_successfully
    ports:
      - "18080:8080"

  gst-worker:
    build:
      context: ..
      dockerfile: "#05 temporal/Dockerfile.worker"
    env_file:
      - .env
    environment:
      TEMPORAL_SERVER: temporal:7233
      INFISICAL_API_URL: http://infisical:8080
    depends_on:
      gst-db-local:
        condition: service_healthy
      temporal:
        condition: service_started
      infisical:
        condition: service_started

  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "17233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CSRF_COOKIE_INSECURE: "true"
    ports:
      - "18088:8080"

volumes:
  gst-local-postgres-data:
  temporal-postgres-data:
  infisical-postgres-data:
  infisical-redis-data:
